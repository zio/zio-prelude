# task and should be included in the git repository. Please do not edit it manually.

name: Auto-merge bot dependency PRs
env: {}
'on':
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    continue-on-error: false
    if: ${{ ((github.event_name == 'workflow_dispatch') || (github.event.pull_request.user.login == 'dependabot[bot]')) || (github.event.pull_request.user.login == 'scala-steward') }}
    steps:
    - name: Check App Token
      id: check-app-token
      run: |
        if [ -n "$APP_ID" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        APP_ID: ${{ secrets.APP_ID }}
    - name: Generate Token
      id: generate-token
      uses: zio/generate-github-app-token@v1.0.0
      if: ${{ steps.check-app-token.outputs.configured == 'true' }}
      with:
        app_id: ${{ secrets.APP_ID }}
        app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
    - name: Enable auto-merge for bot PR
      if: ${{ github.event_name == 'pull_request_target' }}
      run: gh pr merge --auto --squash ${{ github.event.number }}
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
    - name: Backfill auto-merge for existing bot PRs
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        set -euo pipefail
        for actor in "dependabot[bot]" "scala-steward"; do
          gh pr list \
            --author "$actor" \
            --state open \
            --json number \
            --jq '.[].number' | \
          xargs -I{} gh pr merge --auto --squash {}
        done
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
