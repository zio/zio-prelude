# This file was autogenerated using `zio-sbt-ci` plugin via `sbt ciGenerateGithubWorkflow`
# task and should be included in the git repository. Please do not edit it manually.

name: CI
env:
  JDK_JAVA_OPTIONS: -XX:+PrintCommandLineFlags -Xms6G -Xmx6G
  SBT_OPTS: -XX:+PrintCommandLineFlags -Xms6G -Xmx6G
  NODE_OPTIONS: --max_old_space_size=6144
'on':
  workflow_dispatch: {}
  release:
    types:
    - published
  push:
    branches:
    - series/2.x
  pull_request:
    branches-ignore:
    - gh-pages
permissions:
  id-token: write
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    continue-on-error: false
    steps:
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@v1.0
      with:
        swap-size-gb: 7
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v5.7.0
      with:
        distribution: corretto
        java-version: '11'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Check all code compiles
      run: sbt --no-colors +Test/compile
    - name: Check artifacts build process
      run: sbt --no-colors +publishLocal
    - name: Check website build process
      run: sbt --no-colors docs/clean; sbt --no-colors docs/buildWebsite
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    continue-on-error: false
    steps:
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@v1.0
      with:
        swap-size-gb: 7
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v5.7.0
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Check if the site workflow is up to date
      run: sbt --no-colors ciCheckGithubWorkflow
    - name: Lint
      run: sbt --no-colors lint
  test:
    name: Test
    runs-on: ubuntu-22.04
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        java:
        - '17'
        scala:
        - 2.12.21
        - 2.13.16
        - 3.3.8
        - 2.13.18
    steps:
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@v1.0
      with:
        swap-size-gb: 7
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v5.7.0
      with:
        distribution: corretto
        java-version: ${{ matrix.java }}
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Test
      if: ${{ matrix.scala == '2.12.21' }}
      run: sbt --no-colors ++${{ matrix.scala }} benchmarks/test magnoliaTestsJVM/test magnoliaJVM/test macrosJVM/test coreTestsJVM/test coreJVM/test experimentalTestsJVM/test examplesJVM/test experimentalLawsJVM/test lawsJVM/test experimentalJVM/test scalaParallelCollectionsJVM/test
    - name: Test
      if: ${{ matrix.scala == '2.13.16' }}
      run: sbt --no-colors ++${{ matrix.scala }} benchmarks/test magnoliaTestsJVM/test magnoliaJVM/test macrosJVM/test coreTestsJVM/test coreJVM/test experimentalTestsJVM/test examplesJVM/test experimentalLawsJVM/test lawsJVM/test experimentalJVM/test scalaParallelCollectionsJVM/test
    - name: Test
      if: ${{ matrix.scala == '3.3.8' }}
      run: sbt --no-colors ++${{ matrix.scala }} benchmarks/test magnoliaTestsJVM/test magnoliaJVM/test macrosJVM/test coreTestsJVM/test coreJVM/test experimentalTestsJVM/test examplesJVM/test experimentalLawsJVM/test lawsJVM/test experimentalJVM/test scalaParallelCollectionsJVM/test
    - name: Test
      if: ${{ matrix.scala == '2.13.18' }}
      run: sbt --no-colors ++${{ matrix.scala }} docs/test
  testJvms:
    name: Test JVMs
    runs-on: ubuntu-22.04
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        java:
        - '11'
        - '21'
    steps:
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@v1.0
      with:
        swap-size-gb: 7
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v5.7.0
      with:
        distribution: corretto
        java-version: ${{ matrix.java }}
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Test
      run: sbt --no-colors coreJVM/test coreTestsJVM/test examplesJVM/test experimentalJVM/test experimentalLawsJVM/test experimentalTestsJVM/test lawsJVM/test macrosJVM/test magnoliaJVM/test magnoliaTestsJVM/test scalaParallelCollectionsJVM/test benchmarks/test docs/test
  testPlatforms:
    name: Test Platforms
    runs-on: ubuntu-22.04
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        platform:
        - JS
        - Native
    steps:
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@v1.0
      with:
        swap-size-gb: 7
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v5.7.0
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Test on different Scala target platforms
      run: sbt --no-colors test${{ matrix.platform }}
  update-readme:
    name: Update README
    runs-on: ubuntu-22.04
    continue-on-error: false
    permissions:
      contents: read
      pull-requests: write
    if: ${{ github.event_name == 'push' }}
    steps:
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@v1.0
      with:
        swap-size-gb: 7
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v5.7.0
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Generate Readme
      run: sbt --no-colors docs/generateReadme
    - name: Commit Changes
      run: |
        git config --local user.email "zio-assistant[bot]@users.noreply.github.com"
        git config --local user.name "ZIO Assistant"
        git add README.md
        git commit -m "Update README.md" || echo "No changes to commit"
    - name: Generate Token
      id: generate-token
      uses: zio/generate-github-app-token@v1.0.0
      with:
        app_id: ${{ secrets.APP_ID }}
        app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
    - name: Create Pull Request
      id: cpr
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        body: |-
          Autogenerated changes after running the `sbt docs/generateReadme` command of the [zio-sbt-website](https://zio.dev/zio-sbt) plugin.

          I will automatically update the README.md file whenever there is new change for README.md, e.g.
            - After each release, I will update the version in the installation section.
            - After any changes to the "docs/index.md" file, I will update the README.md file accordingly.
        branch: zio-sbt-website/update-readme
        base: ${{ github.event.repository.default_branch }}
        commit-message: Update README.md
        token: ${{ steps.generate-token.outputs.token }}
        delete-branch: true
        title: Update README.md
        add-paths: README.md
    - name: Approve PR
      if: ${{ steps.cpr.outputs.pull-request-number }}
      run: gh pr review "$PR_URL" --approve
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
    - name: Enable Auto-Merge
      if: ${{ steps.cpr.outputs.pull-request-number }}
      run: gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
  ci:
    name: ci
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
    - lint
    - test
    - testJvms
    - testPlatforms
    - build
    if: always()
    steps:
    - name: Report Failed CI
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: 'echo "ci failed: one or more required jobs did not succeed"; exit 1'
    - name: Report Successful CI
      run: echo "ci passed"
  release:
    name: Release
    runs-on: ubuntu-22.04
    continue-on-error: false
    needs:
    - ci
    if: ${{ (((github.event_name == 'release') && (github.event.action == 'published')) || (github.event_name == 'workflow_dispatch')) || ((github.event_name == 'push') && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    steps:
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@v1.0
      with:
        swap-size-gb: 7
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v5.7.0
      with:
        distribution: corretto
        java-version: '11'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Release
      run: sbt --no-colors ci-release
      env:
        PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        PGP_SECRET: ${{ secrets.PGP_SECRET }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
  release-docs:
    name: Release Docs
    runs-on: ubuntu-22.04
    continue-on-error: false
    needs:
    - release
    if: ${{ ((github.event_name == 'release') && (github.event.action == 'published')) || (github.event_name == 'workflow_dispatch') }}
    steps:
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@v1.0
      with:
        swap-size-gb: 7
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v5.7.0
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Setup NodeJs
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.12.0
        registry-url: https://registry.npmjs.org
    - name: Publish Docs to NPM Registry
      run: sbt --no-colors docs/publishToNpm
  notify-docs-release:
    name: Notify Docs Release
    runs-on: ubuntu-22.04
    continue-on-error: false
    needs:
    - release-docs
    if: ${{ ((github.event_name == 'release') && (github.event.action == 'published')) || (github.event_name == 'workflow_dispatch') }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Check App Token
      id: check-app-token
      run: |
        if [ -n "$APP_ID" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        APP_ID: ${{ secrets.APP_ID }}
    - name: Generate Token
      id: generate-token
      uses: zio/generate-github-app-token@v1.0.0
      if: ${{ steps.check-app-token.outputs.configured == 'true' }}
      with:
        app_id: ${{ secrets.APP_ID }}
        app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
    - name: notify the main repo about the new release of docs package
      run: |
        PACKAGE_NAME=$(cat docs/package.json | grep '"name"' | awk -F'"' '{print $4}')
        PACKAGE_VERSION=$(npm view $PACKAGE_NAME version)
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: token $NOTIFY_TOKEN"\
            https://api.github.com/repos/zio/zio/dispatches \
            -d '{
                  "event_type":"update-docs",
                  "client_payload":{
                    "package_name":"'"${PACKAGE_NAME}"'",
                    "package_version": "'"${PACKAGE_VERSION}"'"
                  }
                }'
      env:
        NOTIFY_TOKEN: ${{ steps.generate-token.outputs.token || secrets.PAT_TOKEN }}
